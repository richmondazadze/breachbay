map $http_upgrade $breachbay_connection_upgrade { default upgrade; '' close; }
map $http_origin $breachbay_cors_origin { default ''; 'https://breachbay.us' 'https://breachbay.us'; }
limit_req_zone $binary_remote_addr zone=breachbay_auth:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=breachbay_upload:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=breachbay_ai:10m rate=6r/m;
log_format breachbay_sanitized '$remote_addr $request_method $uri $status $body_bytes_sent';
server {
  listen 127.0.0.1:8080;
  server_name breachbay.us;
  access_log /var/log/nginx/breachbay-app.log breachbay_sanitized;
  client_max_body_size 320k;
  location /api/auth/ {
    limit_req zone=breachbay_auth burst=30 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host breachbay.us;
    proxy_set_header X-Forwarded-Host breachbay.us;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }
  location = /api/evidence/upload {
    limit_req zone=breachbay_upload burst=5 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host breachbay.us;
    proxy_set_header X-Forwarded-Host breachbay.us;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }
  location = /api/investigations {
    limit_req zone=breachbay_ai burst=2 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host breachbay.us;
    proxy_set_header X-Forwarded-Host breachbay.us;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host breachbay.us;
    proxy_set_header X-Forwarded-Host breachbay.us;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $breachbay_connection_upgrade;
    proxy_buffering off;
    proxy_read_timeout 120s;
  }
}
server {
  listen 127.0.0.1:8081;
  server_name db.breachbay.us;
  access_log /var/log/nginx/breachbay-db.log breachbay_sanitized;
  client_max_body_size 20k;
  add_header Access-Control-Allow-Origin $breachbay_cors_origin always;
  add_header Access-Control-Allow-Methods 'POST, GET, OPTIONS' always;
  add_header Access-Control-Allow-Headers 'Authorization, Content-Type' always;
  add_header Vary Origin always;
  location = /v1/identity/websocket-token {
    limit_req zone=breachbay_auth burst=30 nodelay;
    limit_req_status 429;
    if ($request_method = OPTIONS) { return 204; }
    if ($request_method != POST) { return 405; }
    if ($http_authorization = '') { return 401; }
    proxy_pass http://127.0.0.1:3001;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
  }
  location = /v1/database/breachbay/subscribe {
    if ($request_method != GET) { return 405; }
    if ($http_upgrade != 'websocket') { return 426; }
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_set_header Host db.breachbay.us;
    proxy_read_timeout 1d;
    proxy_send_timeout 1d;
    proxy_buffering off;
    proxy_hide_header Access-Control-Allow-Origin;
  }
  location / { return 403; }
}
